<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #25262b; --bg-hover: #2c2e33; --bg-deep: #1a1b1e; --text: #c1c2c5; --white: #f1f3f5;
    --dim: #909296; --blue: #228be6; --green: #40c057; --red: #fa5252; --yellow: #fab005; --orange: #fd7e14; --lime: #82c91e; --gray: #5c5f66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; font-family: Roboto, sans-serif; color: var(--text); background: #000; }
  #scene { position: absolute; inset: 0; }
  #bg { position: absolute; inset: 0; }
  #shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 60%, transparent 40%, rgba(0,0,0,.35) 100%); }

  /* ---------- ox_lib context menu ---------- */
  .ctx { position: absolute; top: 11%; right: 25%; width: 320px; }
  .ctx-head { display: flex; gap: 6px; margin-bottom: 10px; }
  .ctx-btn { width: 42px; height: 42px; flex: 0 0 42px; background: var(--bg); border-radius: 4px; display: grid; place-items: center; color: var(--text); font-size: 14px; }
  .ctx-title { flex: 1; height: 42px; background: var(--bg); border-radius: 4px; display: grid; place-items: center; font-weight: 500; font-size: 15px; color: var(--white); padding: 0 10px; text-align: center; }
  .ctx-list { max-height: 560px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; }
  .opt { background: var(--bg); border-radius: 4px; padding: 10px; display: flex; align-items: center; gap: 12px; min-height: 52px; position: relative; }
  .opt.hover { background: var(--bg-hover); }
  .opt.disabled { opacity: .5; }
  .opt .ico { width: 26px; text-align: center; font-size: 19px; color: var(--text); flex: 0 0 26px; }
  .opt .body { flex: 1; min-width: 0; }
  .opt .t { font-size: 14px; color: var(--white); line-height: 1.3; }
  .opt .d { font-size: 12px; color: var(--dim); margin-top: 2px; line-height: 1.35; }
  .opt .arrow { color: var(--text); font-size: 13px; }
  .bar { height: 6px; background: #373a40; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 3px; }

  .tip { position: absolute; width: 230px; background: var(--bg); border-radius: 4px; padding: 10px 12px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .tip div { padding: 2px 0; color: var(--text); }
  .tip b { color: var(--white); font-weight: 500; }

  /* ---------- notifications ---------- */
  .notifs { position: absolute; top: 18px; right: 18px; width: 320px; display: flex; flex-direction: column; gap: 10px; }
  .notif { background: var(--bg); border-radius: 4px; padding: 12px; display: flex; gap: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .notif .ni { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 15px; flex: 0 0 32px; }
  .notif .nt { color: var(--white); font-weight: 500; font-size: 14px; }
  .notif .nd { color: var(--dim); font-size: 13px; margin-top: 2px; line-height: 1.4; }

  /* ---------- modal (alert / input) ---------- */
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; }
  .modal { background: var(--bg); border-radius: 6px; padding: 20px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .modal h2 { font-size: 17px; color: var(--white); font-weight: 500; margin-bottom: 14px; }
  .modal.input h2 { text-align: center; }
  .modal p { font-size: 14px; line-height: 1.55; margin-bottom: 8px; color: var(--text); }
  .modal p strong { color: var(--white); }
  .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .btn { padding: 0 18px; height: 36px; border-radius: 4px; font-size: 14px; font-weight: 500; display: grid; place-items: center; }
  .btn.cancel { background: #2c2e33; border: 1px solid #373a40; color: var(--text); }
  .btn.ok { background: rgba(34,139,230,.2); color: #74c0fc; }
  .btn.solid { background: var(--blue); color: #fff; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
  .field label .req { color: var(--red); }
  .inp { height: 36px; background: var(--bg-deep); border: 1px solid #373a40; border-radius: 4px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--white); }
  .inp.focus { border-color: var(--blue); }
  .inp .ph { color: var(--gray); }
  .chk { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); margin-bottom: 12px; }
  .chk .box { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #373a40; background: var(--bg-deep); display: grid; place-items: center; font-size: 11px; color: #fff; flex: 0 0 20px; }
  .chk .box.on { background: var(--blue); border-color: var(--blue); }

  /* ---------- text ui ---------- */
  .textui { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); background: var(--bg); color: var(--white); border-radius: 4px; padding: 12px 16px; font-size: 15px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }

  /* ---------- progress circle ---------- */
  .pcircle { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pcircle .lbl { background: var(--bg); padding: 4px 10px; border-radius: 4px; font-size: 13px; color: var(--white); }

  /* ---------- ox_target ---------- */
  .eye { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 22px; color: #3bc9db; text-shadow: 0 0 8px rgba(0,0,0,.8); }
  .tgt { position: absolute; left: calc(50% + 26px); top: calc(50% - 14px); display: flex; flex-direction: column; gap: 4px; }
  .tgt div { background: rgba(26,27,30,.92); color: var(--white); font-size: 14px; padding: 7px 12px; border-radius: 4px; display: flex; align-items: center; gap: 9px; min-width: 170px; }
  .tgt div.hover { background: rgba(44,46,51,.96); }
  .tgt i { color: #3bc9db; width: 16px; text-align: center; }

  /* ---------- caption ---------- */
  .cap { position: absolute; left: 18px; bottom: 18px; background: rgba(20,21,24,.82); border-left: 3px solid var(--orange); padding: 10px 14px; border-radius: 3px; max-width: 520px; }
  .cap .ct { font-size: 18px; font-weight: 700; color: var(--white); letter-spacing: .2px; }
  .cap .cd { font-size: 13px; color: var(--text); margin-top: 3px; line-height: 1.4; }
  .brand { position: absolute; right: 18px; bottom: 18px; font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="scene">
  <svg id="bg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="shade"></div>
  <div id="ui"></div>
</div>
<script src="scenes.js"></script>
<script src="render.js"></script>
</body>
</html>
